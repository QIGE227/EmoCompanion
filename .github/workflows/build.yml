name: Build EmoCompanion APK

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          autoconf automake libtool pkg-config \
          libffi-dev libssl-dev zlib1g-dev

    - name: Install buildozer
      run: |
        pip install buildozer Cython virtualenv

    - name: Cache buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-v3-${{ hashFiles('buildozer.spec') }}

    - name: Pre-download NDK (workaround buildozer download bug)
      run: |
        NDK_VER="r28c"
        NDK_DIR="$HOME/.buildozer/android/platform/android-ndk-${NDK_VER}"
        if [ ! -d "$NDK_DIR" ]; then
          echo "Downloading NDK ${NDK_VER}..."
          mkdir -p "$(dirname "$NDK_DIR")"
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip" -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d "$HOME/.buildozer/android/platform/"
          rm /tmp/ndk.zip
          echo "NDK installed at $NDK_DIR"
        else
          echo "NDK already cached at $NDK_DIR"
        fi
        echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

    - name: Install Android SDK components
      run: |
        SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_ROOT"

        # 下载 cmdline-tools
        if [ ! -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip -O /tmp/sdk.zip
          unzip -qo /tmp/sdk.zip -d "$SDK_ROOT/cmdline-tools/"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest" 2>/dev/null || true
          rm /tmp/sdk.zip
        fi

        # buildozer 期望 sdkmanager 在 tools/bin/ 下，创建符号链接
        mkdir -p "$SDK_ROOT/tools/bin"
        ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"

        # 安装必要组件
        yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
          "platform-tools" "platforms;android-33" "build-tools;33.0.0" 2>&1 || true

        echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

    - name: Build APK
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EmoCompanion-APK
        path: bin/*.apk
        retention-days: 30